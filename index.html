<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sync Budget</title>
    
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="icon.png">
    <link rel="icon" href="icon.png">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <style>
        body { font-family: 'Prompt', sans-serif; }
        input[type="number"]::-webkit-outer-spin-button,
        input[type="number"]::-webkit-inner-spin-button {
            -webkit-appearance: none; margin: 0;
        }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>

    <script>
        let budgetData = [
            { id: 'daily', name: 'ใช้ในชีวิตประจำวัน', limit: 2500, spent: 0, color: '#3b82f6', percent: 0.2778 }, 
            { id: 'invest', name: 'เงินออม + ลงทุน', limit: 2500, spent: 0, color: '#10b981', percent: 0.2778 }, 
            { id: 'parents', name: 'ให้พ่อแม่', limit: 2000, spent: 0, color: '#8b5cf6', percent: 0.2222 }, 
            { id: 'happy', name: 'งบเพื่อความสุข', limit: 861, spent: 0, color: '#f59e0b', percent: 0.0957 }, 
            { id: 'claude', name: 'ค่า Claude Pro', limit: 740, spent: 0, color: '#ef4444', percent: 0.0822 }, 
            { id: 'gas', name: 'ค่าน้ำมัน', limit: 200, spent: 0, color: '#06b6d4', percent: 0.0222 }, 
            { id: 'net', name: 'ค่าอินเทอร์เน็ต', limit: 199, spent: 0, color: '#64748b', percent: 0.0221 } 
        ];

        let transactions = [];
        let budgetChart = null;

        function loadLocalData() {
            const savedData = localStorage.getItem('mySyncBudget');
            if (savedData) {
                try {
                    let parsed = JSON.parse(savedData);
                    budgetData = budgetData.map((item, index) => {
                        let savedItem = parsed[index] || {};
                        return {
                            ...item,
                            spent: (savedItem.spent === undefined || isNaN(savedItem.spent) || savedItem.spent === null) ? 0 : savedItem.spent,
                            limit: (savedItem.limit === undefined || isNaN(savedItem.limit) || savedItem.limit === null) ? item.limit : savedItem.limit
                        };
                    });
                } catch(e) { console.error("Parse error", e); }
            }
            
            const savedLogs = localStorage.getItem('mySyncLogs');
            if (savedLogs) {
                try {
                    transactions = JSON.parse(savedLogs).filter(log => !isNaN(log.amount)); 
                } catch(e) {}
            }
        }

        function saveLocalData() {
            localStorage.setItem('mySyncBudget', JSON.stringify(budgetData));
            localStorage.setItem('mySyncLogs', JSON.stringify(transactions));
        }

        function renderApp() {
            const container = document.getElementById('budget-cards');
            const selectCategory = document.getElementById('income-category');
            container.innerHTML = '';
            
            if(selectCategory.options.length === 0) {
                budgetData.forEach((item, index) => {
                    let option = document.createElement('option');
                    option.value = index;
                    option.text = item.name;
                    if(index === 1) option.selected = true; 
                    selectCategory.appendChild(option);
                });
            }

            let totalSpent = 0;
            let totalBudget = 0;

            budgetData.forEach(item => {
                totalSpent += item.spent;
                totalBudget += item.limit;
            });

            budgetData.forEach((item, index) => {
                const remaining = item.limit - item.spent;
                const limitCalc = item.limit > 0 ? item.limit : 1; 
                const spendPercent = Math.min((item.spent / limitCalc) * 100, 100).toFixed(1);
                const scalePercent = totalBudget > 0 ? ((item.limit / totalBudget) * 100).toFixed(1) : 0; 
                
                const barColor = spendPercent > 80 ? 'bg-red-500' : 'bg-blue-900';
                const textColor = remaining < 0 ? 'text-red-500' : 'text-gray-500';

                container.innerHTML += `
                    <div class="bg-white rounded-xl shadow-sm p-4 mb-4 border-l-4" style="border-color: ${item.color}">
                        <div class="flex justify-between items-start mb-1">
                            <div>
                                <h3 class="font-medium text-gray-800">${item.name}</h3>
                                <p class="text-xs text-gray-400">สัดส่วน: ${scalePercent}% ของรายรับ</p>
                            </div>
                            <div class="text-right">
                                <span class="text-sm font-semibold ${textColor}">${remaining.toLocaleString()} ฿ คงเหลือ</span>
                                <p class="text-xs text-gray-400">จากงบ ${Math.round(item.limit).toLocaleString()} ฿</p>
                            </div>
                        </div>
                        <div class="w-full bg-gray-100 rounded-full h-2 mb-3 mt-2">
                            <div class="${barColor} h-2 rounded-full transition-all duration-300" style="width: ${spendPercent}%"></div>
                        </div>
                        <div class="flex gap-2 mt-2">
                            <input type="number" id="expense-${index}" placeholder="จ่ายไป (บาท)" class="border border-gray-200 rounded-lg p-2 text-sm w-full focus:outline-none focus:ring-1 focus:ring-blue-900">
                            <button onclick="addExpense(${index})" class="bg-gray-800 text-white px-4 py-2 rounded-lg text-sm font-medium whitespace-nowrap hover:bg-black transition-colors shadow-sm">หักเงิน</button>
                        </div>
                    </div>
                `;
            });

            document.getElementById('total-budget').innerText = Math.round(totalBudget).toLocaleString();
            document.getElementById('total-spent').innerText = Math.round(totalSpent).toLocaleString();
            document.getElementById('total-remaining').innerText = Math.round(totalBudget - totalSpent).toLocaleString();

            updateChart();
            renderLogs();
        }

        function addLog(type, category, amount) {
            const now = new Date();
            const timeString = now.toLocaleDateString('th-TH', { day: '2-digit', month: 'short', hour: '2-digit', minute:'2-digit' });
            transactions.unshift({ date: timeString, type: type, category: category, amount: amount });
            if(transactions.length > 50) transactions.pop(); 
            saveLocalData();
        }

        function renderLogs() {
            const logContainer = document.getElementById('transaction-logs');
            logContainer.innerHTML = '';
            
            if(transactions.length === 0) {
                logContainer.innerHTML = `<p class="text-sm text-gray-400 text-center py-4">ยังไม่มีประวัติการทำรายการ</p>`;
                return;
            }

            transactions.forEach(log => {
                const isExpense = log.type === 'expense';
                const sign = isExpense ? '-' : '+';
                const color = isExpense ? 'text-red-500' : 'text-green-500';
                
                logContainer.innerHTML += `
                    <div class="flex justify-between items-center py-2 border-b border-gray-50 last:border-0">
                        <div>
                            <p class="text-sm font-medium text-gray-700">${log.category}</p>
                            <p class="text-xs text-gray-400">${log.date}</p>
                        </div>
                        <span class="text-sm font-semibold ${color}">${sign}${log.amount.toLocaleString()} ฿</span>
                    </div>
                `;
            });
        }

        function addExpense(index) {
            const input = document.getElementById(`expense-${index}`);
            const amount = parseFloat(input.value);
            if (!isNaN(amount) && amount > 0) {
                budgetData[index].spent += amount;
                addLog('expense', budgetData[index].name, amount);
                input.value = '';
                saveLocalData();
                renderApp();
            }
        }

        function addIncome() {
            const amountInput = document.getElementById('income-amount');
            const categorySelect = document.getElementById('income-category');
            const amount = parseFloat(amountInput.value);
            const catIndex = parseInt(categorySelect.value);

            if (!isNaN(amount) && amount > 0) {
                budgetData[catIndex].limit += amount;
                addLog('income', `โปะเงิน: ${budgetData[catIndex].name}`, amount);
                amountInput.value = '';
                saveLocalData();
                renderApp();
                showToast("อัปเดตยอดเรียบร้อย!");
            }
        }

        function updateChart() {
            const ctx = document.getElementById('budgetChart').getContext('2d');
            const labels = budgetData.map(item => item.name);
            const data = budgetData.map(item => item.limit);
            const colors = budgetData.map(item => item.color);

            if (budgetChart) {
                budgetChart.data.datasets[0].data = data;
                budgetChart.update();
            } else {
                budgetChart = new Chart(ctx, {
                    type: 'doughnut',
                    data: { labels: labels, datasets: [{ data: data, backgroundColor: colors, borderWidth: 2, borderColor: '#ffffff' }] },
                    options: {
                        responsive: true, maintainAspectRatio: false, cutout: '65%',
                        plugins: { legend: { position: 'right', labels: { font: { family: 'Prompt', size: 10 }, boxWidth: 12 } } }
                    }
                });
            }
        }

        // ระบบโชว์แจ้งเตือนแบบป้องกันการบังปุ่ม
        function showToast(msg) {
            const toast = document.getElementById('toast');
            if(toast) {
                toast.innerText = msg;
                toast.style.display = 'block';
                setTimeout(() => toast.style.display = 'none', 3000);
            }
        }

        // ระบบ Modal แบบ Inline ป้องกันบั๊กค้าง 100%
        function openSettings() {
            const modal = document.getElementById('settings-modal');
            if (modal) {
                modal.style.display = 'flex';
                switchTab('manual');
            }
        }
        
        function closeSettings() {
            const modal = document.getElementById('settings-modal');
            if (modal) modal.style.display = 'none';
        }

        function switchTab(tab) {
            const tabManual = document.getElementById('tab-manual');
            const tabAuto = document.getElementById('tab-auto');
            const btnManual = document.getElementById('btn-tab-manual');
            const btnAuto = document.getElementById('btn-tab-auto');
            const form = document.getElementById('manual-form');

            if (!tabManual || !tabAuto || !btnManual || !btnAuto || !form) return;

            if (tab === 'manual') {
                tabManual.style.display = 'block';
                tabAuto.style.display = 'none';
                btnManual.className = 'flex-1 py-3 text-sm font-medium border-b-2 border-blue-900 text-blue-900 bg-white';
                btnAuto.className = 'flex-1 py-3 text-sm font-medium border-b-2 border-transparent text-gray-400 bg-gray-50';
                
                form.innerHTML = '';
                budgetData.forEach((item, index) => {
                    form.innerHTML += `
                        <div class="mb-3">
                            <label class="block text-sm text-gray-700 mb-1">${item.name}</label>
                            <input type="number" id="edit-limit-${index}" value="${Math.round(item.limit)}" class="border border-gray-300 rounded-lg p-2 text-sm w-full focus:outline-none focus:ring-1 focus:ring-blue-900">
                        </div>`;
                });
            } else {
                tabManual.style.display = 'none';
                tabAuto.style.display = 'block';
                btnAuto.className = 'flex-1 py-3 text-sm font-medium border-b-2 border-blue-900 text-blue-900 bg-white';
                btnManual.className = 'flex-1 py-3 text-sm font-medium border-b-2 border-transparent text-gray-400 bg-gray-50';
            }
        }

        function saveManualSettings() {
            budgetData.forEach((item, index) => {
                const inputEl = document.getElementById(`edit-limit-${index}`);
                if(inputEl) {
                    const newVal = parseFloat(inputEl.value);
                    if (!isNaN(newVal) && newVal >= 0) item.limit = newVal;
                }
            });
            saveLocalData();
            renderApp();
            closeSettings();
        }

        function autoDistribute() {
            const inputEl = document.getElementById('auto-total-amount');
            if(!inputEl) return;
            
            const totalInput = parseFloat(inputEl.value);
            if (!isNaN(totalInput) && totalInput > 0) {
                let calculatedTotal = 0;
                budgetData.forEach((item, index) => {
                    let safePercent = item.percent || 0;
                    let newLimit = Math.round(totalInput * safePercent);
                    if(index === budgetData.length - 1) {
                        newLimit = totalInput - calculatedTotal;
                    }
                    item.limit = newLimit;
                    calculatedTotal += newLimit;
                });
                saveLocalData();
                renderApp();
                closeSettings();
                showToast("จัดสรรงบอัตโนมัติสำเร็จ!");
            } else {
                alert("กรุณาระบุยอดเงินรวมให้ถูกต้อง");
            }
        }

        function resetData() {
            if (confirm("คุณต้องการล้างประวัติการใช้จ่ายทั้งหมดเพื่อเริ่มเดือนใหม่ใช่หรือไม่? (งบที่ตั้งไว้จะยังคงอยู่)")) {
                budgetData.forEach(item => item.spent = 0);
                transactions = [];
                saveLocalData();
                renderApp();
            }
        }

        function hardReset() {
            if (confirm("⚠️ รีเซ็ตแอปทั้งหมดกลับเป็นค่าเริ่มต้นหรือไม่? (ข้อมูลที่บันทึกไว้จะหายทั้งหมด)")) {
                localStorage.removeItem('mySyncBudget');
                localStorage.removeItem('mySyncLogs');
                location.reload();
            }
        }

        window.onload = () => {
            loadLocalData();
            renderApp();
        };
    </script>
</head>
<body class="bg-gray-50 pb-12 antialiased">
    
    <!-- Header -->
    <div class="bg-blue-900 text-white p-6 rounded-b-3xl shadow-lg sticky top-0 z-10">
        <div class="flex justify-between items-center mb-4">
            <h1 class="text-xl font-semibold tracking-wide">SYNC BUDGET</h1>
            <div class="flex gap-3 relative z-20">
                <button onclick="resetData()" class="text-blue-200 hover:text-white" title="เริ่มเดือนใหม่">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" />
                    </svg>
                </button>
                <button onclick="openSettings()" class="text-blue-200 hover:text-white" title="จัดการงบ">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z" />
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                    </svg>
                </button>
            </div>
        </div>
        <div class="flex justify-between items-center px-2">
            <div class="text-left">
                <p class="text-blue-200 text-xs uppercase tracking-wider mb-1">งบทั้งหมด</p>
                <p class="text-lg font-semibold"><span id="total-budget">0</span> ฿</p>
            </div>
            <div class="text-center">
                <p class="text-blue-200 text-xs uppercase tracking-wider mb-1">ใช้ไป</p>
                <p class="text-lg font-semibold text-red-300"><span id="total-spent">0</span> ฿</p>
            </div>
            <div class="text-right">
                <p class="text-blue-200 text-xs uppercase tracking-wider mb-1">คงเหลือ</p>
                <p class="text-lg font-semibold text-green-300"><span id="total-remaining">0</span> ฿</p>
            </div>
        </div>
    </div>

    <div class="max-w-md mx-auto px-4 mt-6">
        
        <div class="bg-white rounded-xl shadow-sm p-4 mb-6 relative">
            <h2 class="text-sm font-semibold text-gray-700 mb-2">สัดส่วนงบประมาณ (Scale)</h2>
            <div class="relative h-48 w-full"><canvas id="budgetChart"></canvas></div>
            <button onclick="hardReset()" class="absolute top-4 right-4 text-[10px] text-red-500 hover:bg-red-50 border border-red-200 bg-white px-2 py-1 rounded-md shadow-sm z-10 transition-colors">ล้างข้อมูลแอป</button>
        </div>

        <div class="bg-blue-50 rounded-xl shadow-sm p-4 mb-6 border border-blue-100 relative z-0">
            <h2 class="text-sm font-semibold text-blue-900 mb-3">บันทึกรายรับ / โปะเงินเพิ่ม</h2>
            <div class="flex flex-col gap-2">
                <select id="income-category" class="border border-blue-200 rounded-lg p-2 text-sm focus:outline-none focus:ring-1 focus:ring-blue-500 bg-white"></select>
                <div class="flex gap-2">
                    <input type="number" id="income-amount" placeholder="จำนวนเงิน (บาท)" class="border border-blue-200 rounded-lg p-2 text-sm w-full focus:outline-none focus:ring-1 focus:ring-blue-500">
                    <button onclick="addIncome()" class="bg-blue-600 text-white px-4 py-2 rounded-lg text-sm font-medium hover:bg-blue-700">เพิ่มเงิน</button>
                </div>
            </div>
        </div>

        <h2 class="text-sm font-semibold text-gray-700 mb-3 px-1">รายการใช้จ่ายแต่ละหมวด</h2>
        <div id="budget-cards" class="relative z-0"></div>
        
        <h2 class="text-sm font-semibold text-gray-700 mt-6 mb-3 px-1">ประวัติรายการล่าสุด (Log)</h2>
        <div class="bg-white rounded-xl shadow-sm p-4 mb-6 max-h-60 overflow-y-auto no-scrollbar relative z-0">
            <div id="transaction-logs"></div>
        </div>
    </div>

    <!-- แจ้งเตือน Toast แบบ Inline -->
